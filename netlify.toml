# Response headers for Netlify. (Netlify ignores .htaccess.)
#
# No host redirect here on purpose: a forced marketingadda.com -> www rule
# loops with Netlify's own primary-domain redirect when the bare domain is
# primary. Set the canonical host in the hosting dashboard instead.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Images and icons rarely change; let browsers keep them for 30 days.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# CSS and JS filenames are not versioned, so cache them briefly and revalidate.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Keep the 404 page out of search results (it also has a noindex meta tag).
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Beautiva product page (beautiva/). beautiva.marketingadda.com is a domain alias of this site; this rewrite
# serves the beautiva/ folder at its root. marketingadda.com/beautiva/ shows the same page.
[[redirects]]
  from = "https://beautiva.marketingadda.com/*"
  to = "/beautiva/:splat"
  status = 200
  force = true

[[headers]]
  for = "/beautiva/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Plain-text summary of the site for AI assistants.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
