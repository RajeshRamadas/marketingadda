# Netlify config. Response headers live in _headers (Netlify and Cloudflare both read it).
#
# Keep the primary domain in Netlify's dashboard. The rules below apply only to Beautiva's aliases.

# Custom domains for the existing Beautiva pages in beautiva/.
[[redirects]]
  from = "https://www.beautiva.app/*"
  to = "https://beautiva.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://beautiva.app/business"
  to = "/beautiva/business.html"
  status = 200
  force = true

[[redirects]]
  from = "https://beautiva.app/privacy"
  to = "https://api.beautiva.marketingadda.com/privacy"
  status = 302
  force = true

[[redirects]]
  from = "https://beautiva.app/terms"
  to = "https://api.beautiva.marketingadda.com/terms"
  status = 302
  force = true

[[redirects]]
  from = "https://beautiva.app/*"
  to = "/beautiva/:splat"
  status = 200
  force = true

# The original alias still serves Beautiva for previously shared links.
[[redirects]]
  from = "https://beautiva.marketingadda.com/business"
  to = "/beautiva/business.html"
  status = 200
  force = true

[[redirects]]
  from = "https://beautiva.marketingadda.com/*"
  to = "/beautiva/:splat"
  status = 200
  force = true
